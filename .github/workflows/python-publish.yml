name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the trusted publisher configured on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/pyprobs
    permissions:
      contents: read
      # Lets uv exchange the GitHub OIDC token for a short-lived PyPI upload token.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The package version is read from the release tag.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
