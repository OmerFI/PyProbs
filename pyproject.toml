[project]
name = "pyprobs"
version = "1.2.0"
description = "A module that returns True or False output based on given probability"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ömer Furkan İşleyen", email = "omergumushane@hotmail.com" },
]
keywords = ["probability", "chance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Source = "https://github.com/OmerFI/PyProbs"
Documentation = "https://omerfi.github.io/PyProbs/"
"Bug Tracker" = "https://github.com/OmerFI/PyProbs/issues"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "I", # "Isort"
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
