[project]
site_name = "PyProbs"
site_description = "Get True or False from a probability, whether you write it as a float, a percentage or a fraction."
site_author = "Ömer Furkan İşleyen"
site_url = "https://pyprobs.readthedocs.io/en/latest/"
repo_url = "https://github.com/OmerFI/PyProbs"
repo_name = "OmerFI/PyProbs"
copyright = "Copyright &copy; 2021 Ömer Furkan İşleyen"
# Keeps the page addresses of the former Sphinx docs (src/installation.html), so existing links keep working.
use_directory_urls = false
nav = [
    { "Home" = "index.md" },
    { "Installation" = "src/installation.md" },
    { "Examples" = "src/examples.md" },
    { "API Reference" = "src/api-documentation.md" },
    { "License" = "src/license.md" },
]

[project.theme]
features = [
    "content.code.copy",
    "navigation.footer",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
returns_multiple_items = false
returns_named_value = false
